{{- if .Values.rbac.create -}}
# 본 ClusterRole은 cmd/main.go의 +kubebuilder:rbac 마커와 정합한다.
# config/rbac/role.yaml의 결과를 chart에 통합. controller-gen 결과 변경 시
# 본 파일도 동기화 필요 (Makefile chart-rbac-sync 타겟 — 후속).
# test/chart 가 이 ClusterRole ⊇ role.yaml ∪ metrics_auth_role.yaml 을 강제한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "postgres-operator.fullname" . }}-manager-role
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
rules:
  # shardsplitjobs: AutoSplit(PostgresCluster reconciler)이 만든다 — 마커대로 전 verb.
  - apiGroups: [postgres.keiailab.io]
    resources: [backupjobs, poolers, postgresclusters, postgresdatabases, postgresusers, scheduledbackups, shardsplitjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgres.keiailab.io]
    resources: [imagecatalogs, clusterimagecatalogs]
    verbs: [get, list, watch]
  # ShardSplitJobReconciler (internal/controller/shardsplitjob_controller.go L45) —
  # online resharding state machine 은 shardranges 를 watch + update 한다.
  # create/delete 는 marker 에 없음 (router building block 이 phase 부수효과 담당).
  - apiGroups: [postgres.keiailab.io]
    resources: [shardranges]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [postgres.keiailab.io]
    resources: [backupjobs/status, poolers/status, postgresclusters/status, postgresdatabases/status, postgresusers/status, scheduledbackups/status, shardsplitjobs/status]
    verbs: [get, update, patch]
  - apiGroups: [postgres.keiailab.io]
    resources: [backupjobs/finalizers, poolers/finalizers, postgresclusters/finalizers, postgresdatabases/finalizers, postgresusers/finalizers, scheduledbackups/finalizers]
    verbs: [update]
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # router HPA — PostgresCluster 컨트롤러가 Owns 로 watch 한다(없으면 informer 동기화 실패).
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [services, configmaps, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  # nodes: 재구축 엔진(#226)이 stuck-Terminating 멤버 pod 를 force-delete로
  # 승격하기 전, 대상 node 의 Ready condition 을 확인해 "정말 죽은 노드"에서만
  # 승격하도록 하는 안전 게이트(stuckTerminatingOnDeadNode/nodeNotReady) 에 필요.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  # delete 없음: 재시드는 PVC 를 지우지 않는다(2026-09-24 Retain PV 누수) — 마커(role.yaml)와 같게.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    # delete: 재구축 엔진이 hold 한 멤버 pod 를 지워 StatefulSet 이 다시 만들게 한다 — PGDATA 를
    # 버리는 재시드는 readyToUse 스냅숏 뒤에만(ADR-0031).
    verbs: [get, list, watch, patch, delete]
  # 재구축 엔진이 멤버 데이터를 버리기 전에 뜨는 스냅숏(<pod>-rebuild-<token>)과 그 GC.
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  # Pillar P7 §7 Phase 2 — cert-manager Certificate CR upsert (TLS 통합).
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch, create, update, patch, delete]
  # AutoSplit CPU 관측 — metrics-server PodMetrics 읽기.
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  # --metrics-secure(기본 true) 인증·인가 필터 — config/rbac/metrics_auth_role.yaml.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "postgres-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "postgres-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "postgres-operator.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "postgres-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
