# data 래퍼 차트(postgres-operator/)를 kind 에 올릴 때 운영 values 위에 얹는다(설계 §3.12).
# 바꾸는 것만 적는다: 저장·스냅숏 class · 자원 축소 · tier 노드 · 소비자 0 · 덤프 끔 · apiserver 포트.
# 배치(affinity·TSC)는 덮지 않는다 — GREEN 은 차트 그대로 적격 노드·분산을 판정한다(J11). RED 전용 멤버
# anti-affinity 는 red-values-kind.yaml 이다. 런타임 값(오퍼레이터·pg 이미지 참조, apiserver CIDR)은 드라이버가 덮는다.
postgres-operator:
  image:
    # 드라이버가 이미지를 노드에 싣는다 — 운영의 Always 는 비공개 저장소를 매번 다시 당긴다.
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 운영 nodeSelector(keiailab.dev/tier=1)는 그대로 — kind 에서는 infra 워커만 그 라벨을 갖는다.
  tolerations:
    - key: loopdrill.keiailab.io/infra
      operator: Exists
      effect: NoSchedule
  extraEnvVars:
    # GREEN 재구축 엔진의 스냅숏 class(설계 §3.5). 기점 코드는 읽지 않는다.
    - name: MEMBER_SNAPSHOT_CLASS
      value: nfs-snapshot

networkPolicy:
  kubeAPIServer:
    # kind apiserver = control-plane 노드 6443. NetworkPolicy 는 DNAT 뒤 목적지를 본다.
    port: 6443

cluster:
  shards:
    storage:
      size: 1Gi
      storageClass: nfs-retain
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }

consumerDatabases: []

dumpBackup:
  enabled: false
