# data 래퍼 차트(postgres-operator/)를 kind 에 올릴 때 운영 values 위에 얹는다(설계 §3.12).
# 바꾸는 것만 적는다: 저장·스냅숏 class · 자원 축소 · tier 노드 · 소비자 0 · 덤프 끔 · apiserver 포트 · 배치.
# 런타임 값(오퍼레이터·pg 이미지 참조, apiserver CIDR)은 드라이버가 둘째 values 파일로 덮는다.
postgres-operator:
  image:
    # 드라이버가 이미지를 노드에 싣는다 — 운영의 Always 는 비공개 저장소를 매번 다시 당긴다.
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # 운영 nodeSelector(keiailab.dev/tier=1)는 그대로 — kind 에서는 infra 워커만 그 라벨을 갖는다.
  tolerations:
    - key: loopdrill.keiailab.io/infra
      operator: Exists
      effect: NoSchedule
  extraEnvVars:
    # GREEN 재구축 엔진의 스냅숏 class(설계 §3.5). 기점 코드는 읽지 않는다.
    - name: MEMBER_SNAPSHOT_CLASS
      value: nfs-snapshot

networkPolicy:
  kubeAPIServer:
    # kind apiserver = control-plane 노드 6443. NetworkPolicy 는 DNAT 뒤 목적지를 본다.
    port: 6443

cluster:
  shards:
    storage:
      size: 1Gi
      storageClass: nfs-retain
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: "1", memory: 1Gi }
    # 멤버 셋을 서로 다른 pg 워커에 — S5 가 standby 만 있는 노드를 세운다.
    # 운영 TSC 셀렉터는 PVC 전용 라벨이라 파드와 안 맞는다(설계 §2.1 스프레드) — 그 결함은 그대로 둔다.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/instance: postgres-prod
                app.kubernetes.io/component: shard

consumerDatabases: []

dumpBackup:
  enabled: false
