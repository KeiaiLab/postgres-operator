# ExternalSecret CRD — 객체만 받는다(ESO 컨트롤러 0). data 차트(SE0 뒤)가 superuser Secret 을 입양하는
# ExternalSecret 을 렌더한다. 훈련장은 그 Secret(cnpg-default-superuser)을 실행 때 무작위로 만든다(커밋·판정문 0).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: externalsecrets.external-secrets.io
spec:
  group: external-secrets.io
  names:
    kind: ExternalSecret
    listKind: ExternalSecretList
    plural: externalsecrets
    singular: externalsecret
    shortNames: [es]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
