# PR/main 테스트 게이트 (2026-07-29 신설) — 그간 release/helm-publish/scorecard 만 있고
# 테스트를 도는 잡이 전무해 role-label 리컨실 회귀(INC-0002, data#39)가 조용히 통과했다.
# make test = manifests/generate + envtest 셋업 + 전 패키지(controller envtest 스위트 포함).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Tests (unit + integration, envtest 포함 — make test 가 setup-envtest 를 수행)
        run: make test
